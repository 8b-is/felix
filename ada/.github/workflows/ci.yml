# FELIX|PHOENIX CI/CD Pipeline

name: FELIX|PHOENIX Verification

on:
  push:
    branches: [main, develop]
    paths:
      - 'felix/ada/**'
  pull_request:
    branches: [main]
    paths:
      - 'felix/ada/**'
  workflow_dispatch:

env:
  GPRBUILD_ARGS: "-P felix.gpr -j0"
  GNATPROVE_ARGS: "-P felix.gpr --level=2 --replay --report=all --counterexample --steps=10000"

jobs:
  # Format check
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ada-core/gnat:2024
    steps:
      - uses: actions/checkout@v4
      
      - name: Check formatting
        working-directory: felix/ada
        run: |
          gnatpp --check --indentation=3 --comments=full ada/*.ad[sb]

  # Static analysis
  lint:
    name: Static Analysis
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ada-core/gnat:2024
    steps:
      - uses: actions/checkout@v4
      
      - name: Run gnatcheck
        working-directory: felix/ada
        run: |
          gnatcheck -P felix.gpr --rules=all

  # Build and prove
  verify:
    name: Build & Prove
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ada-core/gnat:2024
    steps:
      - uses: actions/checkout@v4
      
      - name: Build
        working-directory: felix/ada
        run: |
          gprbuild $GPRBUILD_ARGS
      
      - name: Run SPARK proofs
        working-directory: felix/ada
        run: |
          gnatprove $GNATPROVE_ARGS

  # Test
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ada-core/gnat:2024
    needs: verify
    steps:
      - uses: actions/checkout@v4
      
      - name: Run tests
        working-directory: felix/ada
        run: |
          chmod +x test_harness.sh
          ./test_harness.sh ./obj/felix_nand_tcb

  # Memory safety check
  memcheck:
    name: Memory Safety (Valgrind)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ada-core/gnat:2024
    needs: verify
    steps:
      - uses: actions/checkout@v4
      
      - name: Install valgrind
        run: apt-get update && apt-get install -y valgrind
      
      - name: Run under valgrind
        working-directory: felix/ada
        run: |
          valgrind --leak-check=full --error-exitcode=1 ./obj/felix_nand_tcb || true

  # Cross-compilation test
  cross-compile:
    name: Cross-Compile (ARM64)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ada-core/gnat:2024
    steps:
      - uses: actions/checkout@v4
      
      - name: Install cross-compiler
        run: |
          apt-get update && apt-get install -y gnat-14-aarch64-linux-gnu
      
      - name: Cross-compile
        working-directory: felix/ada
        run: |
          gprbuild -P felix.gpr --target=aarch64-linux-gnu -j0

  # Documentation
  docs:
    name: Generate Documentation
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ada-core/gnat:2024
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate GNATdoc
        working-directory: felix/ada
        run: |
          gnatdoc -P felix.gpr -o docs --format=html --index=README.md ada/

      - name: Upload docs
        uses: actions/upload-artifact@v4
        with:
          name: felix-docs
          path: felix/ada/docs/
          retention-days: 30

  # Publish
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [fmt, lint, verify, test, memcheck, cross-compile, docs]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            felix/ada/obj/felix_nand_tcb
            felix/ada/docs/
          generate_release_notes: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true